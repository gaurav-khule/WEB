<script>
  let amount = 150000;
  let roi = 7.1 / 100;
  let openingBalance = 0;
  for (let i = 1; i <= 15; i++) {
    let intrestValue = (openingBalance + amount) * roi;
    intrestValue = Math.round(intrestValue);
    let closingValue = openingBalance + amount + intrestValue;
    document.write(`
    <li>
        ${i},
        ${openingBalance},
        ${amount},
        ${intrestValue},
        ${closingValue}
        </li>
    `);
    openingBalance = closingValue;
  }
</script>
