<script>
  // it create instance of class array
  let brands = new Array("H&M", "BonkerCorner", "SoulsStore");
  console.log(brands);

  // use of forEach() is retrieve the value and index of the data
  // callBack function is an function which is passed as an outer function
  brands.forEach(function (value, i) {
    console.log(value, i);
  });
</script>
