<script>
  let brands = ["Addidas", "New Balance", "Puma", "Nike", "Ascis"];
  console.log(brands);
  brands.push("Jorden", "Comet"); // to push element
  console.log(brands);
  brands.unshift("Vans", "Reebok"); // add in start of array
  console.log(brands);
  brands.pop(); // it will remove last value from array
  console.log(brands);
  brands.shift(); // first value will remove from array
  console.log(brands);
  console.log(brands.includes("New Balance")); // it return t/f
  console.log(brands.indexOf("New Balance")); // it return index no, if not found returns -1
</script>
