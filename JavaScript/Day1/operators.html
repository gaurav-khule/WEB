<script>
  console.log(10 + 20); // no + no = result  30
  console.log(10 + "20"); // concate string   1020

  console.log(10 - "30"); // -20
  console.log(10 / "30"); // 0.3333
  console.log(2 ** 3); // 3 is power here - exponential operator
  console.log(10 % 5); // return reminders = 0
</script>
